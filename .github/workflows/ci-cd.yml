name: CI/CD Pipeline - NexusDash

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ============================================================================
  # 1. CI (Integración Continua): Verificación de Código, Tests y Docker Build
  # ============================================================================
  ci:
    name: 🧪 CI - Lint, Test & Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Instalar dependencias
        run: npm install

      - name: 🔍 Verificación de Sintaxis y Pruebas Unitarias/Integración
        run: npm test

      - name: 🐳 Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Validar Construcción de la Imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: nexusdash:${{ github.sha }}

  # ============================================================================
  # 2. CD (Despliegue Continuo): Despliegue Automático en Render
  # ============================================================================
  cd:
    name: 🚀 CD - Despliegue a Render
    needs: ci
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
      - name: 🌐 Disparar Despliegue en Render (Deploy Hook)
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_HOOK" ]; then
            echo "⚠️ [ADVERTENCIA] La variable secreta 'RENDER_DEPLOY_HOOK_URL' no está configurada en los Secrets de GitHub."
            echo "👉 Para habilitar el auto-deploy continuo:"
            echo "   1. Ve a tu Dashboard en Render -> Selecciona tu Servicio Web."
            echo "   2. En 'Settings', copia la URL de 'Deploy Hook'."
            echo "   3. En tu repositorio de GitHub, ve a Settings -> Secrets and variables -> Actions -> New repository secret."
            echo "   4. Nombra el secret 'RENDER_DEPLOY_HOOK_URL' y pega la URL."
            echo "✅ Paso completado (Modo informativo hasta configurar el Secret)."
            exit 0
          fi

          echo "🚀 Enviando solicitud de despliegue a Render..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$RENDER_HOOK")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "Respuesta de Render (HTTP $HTTP_CODE): $BODY"

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "🎉 Despliegue en Render activado exitosamente!"
          else
            echo "❌ Error al disparar el despliegue en Render. Código HTTP: $HTTP_CODE"
            exit 1
          fi
